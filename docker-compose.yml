# A fixed project name so every checkout (including the clean-clone verify script) shares one database.
name: repro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repro
      POSTGRES_PASSWORD: repro
      POSTGRES_DB: repro
    ports:
      - "5432:5432"
    volumes:
      - repro-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repro -d repro"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  repro-db-data:
