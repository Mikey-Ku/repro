<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Repro plain script example</title>
    <!-- connect-src must include the ingest origin. The SDK adds no inline scripts or styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://repro.internal; script-src 'self'"
    />
    <script src="/vendor/repro.iife.js"></script>
    <script src="/init-repro.js"></script>
  </head>
  <body>
    <h1>Account</h1>

    <!-- Masked by default: password, hidden, and payment-shaped fields need no markup. -->
    <form>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />

      <!-- Free text the heuristics cannot classify: mask it explicitly. -->
      <label for="notes">Notes to support</label>
      <textarea id="notes" name="notes" data-repro-mask></textarea>

      <button type="submit" data-testid="save-account">Save</button>
    </form>

    <!-- A region that must not be recorded at all (replaced by a same-size placeholder). -->
    <aside data-repro-block>
      <h2>Account number</h2>
      <p>0044 1122 3355</p>
    </aside>
  </body>
</html>
